<!DOCTYPE html>
<html>
	<head>
		<title>Manage Items & Settings - FocusSpace</title>
		<meta charset="utf-8">
		<link rel="stylesheet" href="form.css">
	</head>
	<body>
		<h2>⚙️ FocusSpace Dashboard</h2>

		<!-- Notes Section -->
		<div class="section-container">
			<h3>Active Notes</h3>
			<div id="noteList" class="items-list">
				<div class="empty-list-msg">No active notes. Create one below!</div>
			</div>

			<h3 id="noteFormTitle">Add / Edit Note</h3>
			<div class="form-grid">
				<div class="form-group form-group-full">
					<label for="noteTitle">Note Title</label>
					<input type="text" id="noteTitle" placeholder="What needs to be done?" />
				</div>
				
				<div class="form-group">
					<label for="noteDeadline">Deadline</label>
					<input type="date" id="noteDeadline" />
				</div>
				<div class="form-group">
					<label for="notePriority">Priority</label>
					<select id="notePriority">
						<option value="Low">Low</option>
						<option value="Medium">Medium</option>
						<option value="High">High</option>
					</select>
				</div>

				<div class="form-group">
					<label>Note Tag Color</label>
					<div class="color-options" id="colorOptions">
						<div class="color-option selected" style="background-color: #ffeb3b" data-color="#ffeb3b" title="Yellow"></div>
						<div class="color-option" style="background-color: #ff5722" data-color="#ff5722" title="Orange"></div>
						<div class="color-option" style="background-color: #4caf50" data-color="#4caf50" title="Green"></div>
						<div class="color-option" style="background-color: #2196f3" data-color="#2196f3" title="Blue"></div>
						<div class="color-option" style="background-color: #9c27b0" data-color="#9c27b0" title="Purple"></div>
					</div>
				</div>
				<div class="form-group">
					<label for="noteOrder">Display Order</label>
					<input type="number" id="noteOrder" placeholder="1" min="1" />
				</div>

				<div class="form-group">
					<label>Font Color Presets</label>
					<div class="color-options" id="fontColorPresets">
						<div class="color-option selected" style="background-color: #000000" data-color="#000000" title="Black"></div>
						<div class="color-option" style="background-color: #ffffff" data-color="#ffffff" title="White"></div>
						<div class="color-option" style="background-color: #1e293b" data-color="#1e293b" title="Dark Slate"></div>
						<div class="color-option" style="background-color: #f1f5f9" data-color="#f1f5f9" title="Light Slate"></div>
					</div>
				</div>
				<div class="form-group">
					<label>Custom Font Color</label>
					<div class="font-color-picker-group">
						<input type="color" id="noteFontColor" value="#000000" />
						<span>Pick custom color</span>
					</div>
				</div>

				<div class="form-group form-group-full">
					<button id="saveNoteBtn" class="primary-btn">Save Note</button>
				</div>
			</div>
		</div>

		<!-- Books Section -->
		<div class="section-container">
			<h3>Tracked Books</h3>
			<div id="bookList" class="items-list">
				<div class="empty-list-msg">No books tracked. Create one below!</div>
			</div>

			<h3 id="bookFormTitle">Add / Edit Book</h3>
			<div class="form-grid">
				<div class="form-group form-group-full">
					<label for="bookTitle">Book Title</label>
					<input type="text" id="bookTitle" placeholder="e.g., Designing Data-Intensive Applications" />
				</div>
				<div class="form-group">
					<label for="bookPage">Current Page</label>
					<input type="text" id="bookPage" placeholder="90 (or 'Finished')" />
				</div>
				<div class="form-group">
					<label for="bookLastRead">Last Read Date</label>
					<input type="date" id="bookLastRead" />
				</div>
				<div class="form-group form-group-full">
					<button id="saveBookBtn" class="primary-btn">Save Book</button>
				</div>
			</div>
		</div>

		<!-- General Settings Section -->
		<div class="section-container">
			<h3>General Extension Settings</h3>
			<div class="form-grid">
				<div class="form-group">
					<label for="popupInterval">Auto-Popup Notes Interval (minutes)</label>
					<input type="number" id="popupInterval" placeholder="15" min="1" max="180" />
				</div>
				<div class="form-group">
					<label style="visibility: hidden; height: 14px; margin-bottom: 6px;">Submit Spacer</label>
					<button id="saveSettingsBtn" class="primary-btn" style="margin-top: 0; width: 100%;">Save Settings</button>
				</div>
			</div>
		</div>

		<script src="form.js"></script>
	</body>
</html>
