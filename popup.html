<!DOCTYPE html>
<html>
	<head>
		<title>FocusSpace</title>
		<meta charset="utf-8">
		<link rel="stylesheet" href="popup.css">
	</head>
	<body>
		<header>
			<div class="logo">
				<span class="logo-icon">⚡</span>
				<span class="logo-text">FocusSpace</span>
			</div>
		</header>

		<div class="tab-container">
			<button class="tab-button active" data-tab="notes">
				<svg xmlns="http://www.w3.org/2000/svg" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path><polyline points="14 2 14 8 20 8"></polyline><line x1="16" y1="13" x2="8" y2="13"></line><line x1="16" y1="17" x2="8" y2="17"></line><polyline points="10 9 9 9 8 9"></polyline></svg>
				Notes
			</button>
			<button class="tab-button" data-tab="books">
				<svg xmlns="http://www.w3.org/2000/svg" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"></path><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"></path></svg>
				Books
			</button>
			<button class="tab-button" data-tab="timer">
				<svg xmlns="http://www.w3.org/2000/svg" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"></circle><polyline points="12 6 12 12 16 14"></polyline></svg>
				Timer
			</button>
		</div>

		<main>
			<!-- Notes Tab -->
			<div id="notesTab" class="tab-content active">
				<div id="notesList">
					<div class="empty-state">
						<span class="empty-state-icon">📝</span>
						<span>No active notes. Add some in settings!</span>
					</div>
				</div>
			</div>

			<!-- Books Tab -->
			<div id="booksTab" class="tab-content">
				<div id="booksList">
					<div class="empty-state">
						<span class="empty-state-icon">📖</span>
						<span>No books tracked. Add one to start reading!</span>
					</div>
				</div>
			</div>

			<!-- Timer Tab -->
			<div id="timerTab" class="tab-content">
				<div class="timer-tab-content">
					<div class="timer-header">
						<button class="settings-toggle-btn" id="timerSettingsBtn" title="Timer Settings">
							<svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"></circle><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"></path></svg>
						</button>
						<div class="timer-settings-panel" id="timerSettingsPanel">
							<div class="settings-group">
								<label class="settings-label">Durations (minutes)</label>
								<div class="duration-inputs">
									<div class="duration-input-wrapper">
										<span>Work</span>
										<input type="number" id="workDuration" class="settings-input-number" min="1" max="60" value="25">
									</div>
									<div class="duration-input-wrapper">
										<span>Short Break</span>
										<input type="number" id="shortBreakDuration" class="settings-input-number" min="1" max="60" value="5">
									</div>
									<div class="duration-input-wrapper">
										<span>Long Break</span>
										<input type="number" id="longBreakDuration" class="settings-input-number" min="1" max="120" value="15">
									</div>
								</div>
							</div>
							<div class="checkbox-group">
								<label class="checkbox-label">
									<input type="checkbox" id="autoStartBreaks">
									<span>Auto-start Breaks</span>
								</label>
								<label class="checkbox-label">
									<input type="checkbox" id="autoStartWork">
									<span>Auto-start Focus</span>
								</label>
								<label class="checkbox-label">
									<input type="checkbox" id="soundEnabled" checked>
									<span>Chime Sound Notification</span>
								</label>
							</div>
						</div>
					</div>

					<div class="timer-container">
						<svg class="progress-ring" width="166" height="166">
							<circle class="progress-ring-bg" stroke="rgba(255, 255, 255, 0.05)" stroke-width="6" fill="transparent" r="76" cx="83" cy="83"></circle>
							<circle class="progress-ring-circle" id="progressCircle" stroke="#f43f5e" stroke-width="6" fill="transparent" r="76" cx="83" cy="83" stroke-linecap="round"></circle>
						</svg>
						<div class="timer-inner">
							<div id="sessionType" class="session-type session-work">Focus Session</div>
							<div class="timer-display" id="timerDisplay">25:00</div>
							<div class="completed-stats">
								Completed: <strong id="completedSessions">0</strong>
							</div>
						</div>
					</div>

					<div class="timer-controls">
						<button class="control-btn btn-reset" id="resetTimerBtn" title="Reset (R)">
							<svg xmlns="http://www.w3.org/2000/svg" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M21.5 2v6h-6M21.34 15.57a10 10 0 1 1-.57-8.38l5.67-5.67"></path></svg>
						</button>
						<button class="control-btn btn-start-pause" id="startTimerBtn" title="Play / Pause (Space)">
							<svg id="playIcon" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><polygon points="5 3 19 12 5 21 5 3"></polygon></svg>
							<svg id="pauseIcon" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="currentColor" style="display: none;"><rect x="6" y="4" width="4" height="16"></rect><rect x="14" y="4" width="4" height="16"></rect></svg>
						</button>
						<button class="control-btn btn-skip" id="skipTimerBtn" title="Skip Session (S)">
							<svg xmlns="http://www.w3.org/2000/svg" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polygon points="5 4 15 12 5 20 5 4"></polygon><line x1="19" y1="5" x2="19" y2="19"></line></svg>
						</button>
					</div>
				</div>
			</div>
		</main>

		<footer>
			<button class="footer-btn" id="openFormBtn">
				<svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"></circle><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"></path></svg>
				Manage Items & Settings
			</button>
		</footer>

		<script src="popup.js"></script>
	</body>
</html>
